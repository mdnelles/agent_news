# HTTP — certbot will add HTTPS and redirect after you run:
#   sudo certbot --apache -d agent-news.mikenelles.com
<VirtualHost *:80>
    ServerName agent-news.mikenelles.com

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        / http://127.0.0.1:3034/
    ProxyPassReverse / http://127.0.0.1:3034/

    ErrorLog  ${APACHE_LOG_DIR}/agent-news-error.log
    CustomLog ${APACHE_LOG_DIR}/agent-news-access.log combined
</VirtualHost>
